# DDE (Divine Desktop Environment): the defaults. Each user's own changes (Settings) go to
# ~/.config/dde/settings.conf; what's not there comes from here. See <config.h>.
Wallpaper=/usr/share/dde-res/Backgrounds/default.png
Clock24=1
NaturalScroll=0
DoubleClick=450
SoundEffects=1
StartupSound=1
Pinned=divine-files,divine-terminal,divine-music,divine-photos,divine-settings
